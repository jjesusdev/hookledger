spring:
  application:
    name: hookledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hookledger}
    username: ${DB_USER:hookledger}
    password: ${DB_PASSWORD:hookledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: hookledger
    description: Reliable webhook ingestion and delivery platform
    version: 0.1.0

hookledger:
  security:
    max-clock-skew-seconds: ${MAX_CLOCK_SKEW_SECONDS:300}
    max-body-bytes: ${MAX_BODY_BYTES:262144}
  sources:
    demo:
      secret: ${DEMO_WEBHOOK_SECRET:dev-secret}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
  publisher: ${PUBLISHER:log}
  demo:
    enabled: ${DEMO_ENABLED:true}

logging:
  level:
    com.jjesusdev.hookledger: INFO
