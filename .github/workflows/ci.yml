name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  build-image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hookledger:ci

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker compose logs --no-color
          exit 1
      - name: Ingest a signed event and its retry
        run: |
          set -euo pipefail
          first="$(./scripts/send-event.sh smoke-1)"
          echo "first: ${first}"
          echo "${first}" | grep -q '"duplicate":false'

          retry="$(EVENT_ID=smoke-1 ./scripts/send-event.sh)"
          echo "retry: ${retry}"
          echo "${retry}" | grep -q '"duplicate":true'

          for attempt in $(seq 1 30); do
            stats="$(curl -fsS http://localhost:8080/v1/stats)"
            if echo "${stats}" | grep -q '"outboxPending":0'; then
              echo "outbox drained: ${stats}"
              exit 0
            fi
            sleep 1
          done
          echo "outbox did not drain"
          curl -sS http://localhost:8080/v1/stats
          docker compose logs --no-color
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  sqs-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with LocalStack
        run: docker compose -f docker-compose.yml -f docker-compose.sqs.yml up -d --build
      - name: Wait for the app and the queues
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null; then
              echo "app healthy after ${attempt} attempts"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            echo "app did not become healthy"
            docker compose -f docker-compose.yml -f docker-compose.sqs.yml logs --no-color
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.sqs.yml \
              exec -T localstack awslocal sqs get-queue-url --queue-name hookledger-events >/dev/null 2>&1; then
              echo "queues ready after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "queues were not created"
          docker compose -f docker-compose.yml -f docker-compose.sqs.yml logs --no-color
          exit 1
      - name: Ingest and wait for a signed delivery
        run: |
          set -euo pipefail
          response="$(./scripts/send-event.sh sqs-1)"
          echo "ingest: ${response}"
          event_id="$(echo "${response}" | jq -r .id)"

          for attempt in $(seq 1 90); do
            event="$(curl -fsS "http://localhost:8080/v1/events/${event_id}")"
            deliveries="$(curl -fsS "http://localhost:8080/v1/events/${event_id}/deliveries")"
            if echo "${event}" | jq -e '.status == "DELIVERED"' >/dev/null \
              && echo "${deliveries}" | jq -e 'length > 0 and .[0].outcome == "DELIVERED"' >/dev/null; then
              echo "event: ${event}"
              echo "deliveries: ${deliveries}"
              exit 0
            fi
            sleep 1
          done

          echo "event was not delivered through SQS"
          curl -sS "http://localhost:8080/v1/events/${event_id}"
          curl -sS "http://localhost:8080/v1/events/${event_id}/deliveries"
          docker compose -f docker-compose.yml -f docker-compose.sqs.yml logs --no-color
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.sqs.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.sqs.yml down -v

  dlq-replay-smoke:
    runs-on: ubuntu-24.04
    needs: test
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.sqs.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with a target that always fails
        env:
          DEMO_TARGET_URL: http://app:8080/v1/demo/does-not-exist
          WORKER_BACKOFF_BASE_SECONDS: "1"
        run: docker compose ${COMPOSE_FILES} up -d --build
      - name: Wait for the app and the queues
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null; then
              echo "app healthy after ${attempt} attempts"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            echo "app did not become healthy"
            docker compose ${COMPOSE_FILES} logs --no-color
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if docker compose ${COMPOSE_FILES} exec -T localstack \
              awslocal sqs get-queue-url --queue-name hookledger-events >/dev/null 2>&1; then
              echo "queues ready after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "queues were not created"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Drive the event to the DLQ
        run: |
          set -euo pipefail
          response="$(./scripts/send-event.sh dlq-1)"
          echo "ingest: ${response}"
          event_id="$(echo "${response}" | jq -r .id)"
          echo "EVENT_ID=${event_id}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 120); do
            event="$(curl -fsS "http://localhost:8080/v1/events/${event_id}")"
            dlq_pending="$(docker compose ${COMPOSE_FILES} exec -T localstack \
              awslocal sqs get-queue-attributes \
              --queue-url http://localhost:4566/000000000000/hookledger-events-dlq \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' --output text | tr -dc '0-9')"
            dlq_pending="${dlq_pending:-0}"
            if echo "${event}" | jq -e '.status == "FAILED"' >/dev/null && [ "${dlq_pending}" -ge 1 ]; then
              echo "event failed after the configured receives: ${event}"
              echo "dlq messages: ${dlq_pending}"
              exit 0
            fi
            sleep 2
          done

          echo "event never reached the DLQ"
          curl -sS "http://localhost:8080/v1/events/${event_id}"
          curl -sS "http://localhost:8080/v1/events/${event_id}/deliveries"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Restore a healthy worker
        run: docker compose ${COMPOSE_FILES} up -d --no-deps --force-recreate worker
      - name: Replay from the DLQ and wait for delivery
        run: |
          set -euo pipefail
          replay="$(curl -fsS -X POST -H 'X-Admin-Token: demo-admin-token' \
            'http://localhost:8080/v1/admin/replay?max=10')"
          echo "replay: ${replay}"
          echo "${replay}" | jq -e '.replayed >= 1' >/dev/null

          for attempt in $(seq 1 60); do
            event="$(curl -fsS "http://localhost:8080/v1/events/${EVENT_ID}")"
            if echo "${event}" | jq -e '.status == "DELIVERED"' >/dev/null; then
              echo "event delivered after replay: ${event}"
              break
            fi
            sleep 1
          done

          deliveries="$(curl -fsS "http://localhost:8080/v1/events/${EVENT_ID}/deliveries")"
          echo "deliveries: ${deliveries}"

          # The audit trail survives the replay: attempts are a per-event sequence and the last one wins.
          echo "${deliveries}" | jq -e 'to_entries | map(.value.attempt == (.key + 1)) | all' >/dev/null
          echo "${deliveries}" | jq -e '.[-1].outcome == "DELIVERED"' >/dev/null
          echo "${deliveries}" | jq -e '[.[].outcome] | index("FAILED") != null' >/dev/null

          dlq_pending="1"
          for attempt in $(seq 1 15); do
            dlq_pending="$(docker compose ${COMPOSE_FILES} exec -T localstack \
              awslocal sqs get-queue-attributes \
              --queue-url http://localhost:4566/000000000000/hookledger-events-dlq \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' --output text | tr -dc '0-9')"
            dlq_pending="${dlq_pending:-0}"
            if [ "${dlq_pending}" -eq 0 ]; then
              echo "dlq drained after replay"
              exit 0
            fi
            sleep 1
          done
          echo "dlq still has ${dlq_pending} messages after replay"
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILES} logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose ${COMPOSE_FILES} down -v

  worker-down-smoke:
    runs-on: ubuntu-24.04
    needs: test
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.sqs.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose ${COMPOSE_FILES} up -d --build
      - name: Wait for the app and the queues
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null; then
              echo "app healthy after ${attempt} attempts"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            echo "app did not become healthy"
            docker compose ${COMPOSE_FILES} logs --no-color
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if docker compose ${COMPOSE_FILES} exec -T localstack \
              awslocal sqs get-queue-url --queue-name hookledger-events >/dev/null 2>&1; then
              echo "queues ready after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "queues were not created"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Stop the worker and ingest an event
        run: |
          set -euo pipefail
          docker compose ${COMPOSE_FILES} stop worker
          response="$(./scripts/send-event.sh worker-down-1)"
          echo "ingest: ${response}"
          event_id="$(echo "${response}" | jq -r .id)"
          echo "EVENT_ID=${event_id}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 30); do
            event="$(curl -fsS "http://localhost:8080/v1/events/${event_id}")"
            if echo "${event}" | jq -e '.status == "PUBLISHED"' >/dev/null; then
              echo "event published while the worker is down: ${event}"
              exit 0
            fi
            sleep 1
          done
          echo "event was not published to SQS"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Confirm the message is waiting in the queue
        run: |
          set -euo pipefail
          pending="$(docker compose ${COMPOSE_FILES} exec -T localstack \
            awslocal sqs get-queue-attributes \
            --queue-url http://localhost:4566/000000000000/hookledger-events \
            --attribute-names ApproximateNumberOfMessages \
            --query 'Attributes.ApproximateNumberOfMessages' --output text | tr -dc '0-9')"
          pending="${pending:-0}"
          echo "messages waiting: ${pending}"
          [ "${pending}" -ge 1 ]
      - name: Start the worker and wait for delivery
        run: |
          set -euo pipefail
          docker compose ${COMPOSE_FILES} start worker
          for attempt in $(seq 1 60); do
            event="$(curl -fsS "http://localhost:8080/v1/events/${EVENT_ID}")"
            deliveries="$(curl -fsS "http://localhost:8080/v1/events/${EVENT_ID}/deliveries")"
            if echo "${event}" | jq -e '.status == "DELIVERED"' >/dev/null \
              && echo "${deliveries}" | jq -e 'length == 1 and .[0].outcome == "DELIVERED"' >/dev/null; then
              echo "event: ${event}"
              echo "deliveries: ${deliveries}"
              exit 0
            fi
            sleep 1
          done
          echo "the worker did not deliver the queued event"
          curl -sS "http://localhost:8080/v1/events/${EVENT_ID}"
          curl -sS "http://localhost:8080/v1/events/${EVENT_ID}/deliveries"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILES} logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose ${COMPOSE_FILES} down -v

  load-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker compose logs --no-color
          exit 1
      - name: Run the load test
        run: |
          docker run --rm --network host -v "${PWD}/load:/load:ro" \
            -e BASE_URL=http://localhost:8080 \
            -e RATE=50 -e DURATION=30s \
            grafana/k6:2.3.0 run /load/ingest.js
      - name: Wait for the outbox to drain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            stats="$(curl -fsS http://localhost:8080/v1/stats)"
            if echo "${stats}" | jq -e '.outboxPending == 0' >/dev/null; then
              echo "stats: ${stats}"
              echo "${stats}" | jq -e '.total >= 1500' >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "outbox did not drain after the load test"
          curl -sS http://localhost:8080/v1/stats
          docker compose logs --no-color
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  observability-smoke:
    runs-on: ubuntu-24.04
    needs: test
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.observability.yml
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Prometheus config and the alert rules
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/observability/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus prom/prometheus:v3.15.1 \
            check config prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/observability/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus prom/prometheus:v3.15.1 \
            test rules alerts.test.yml
      - name: Start the stack with Prometheus and Grafana
        run: docker compose ${COMPOSE_FILES} up -d --build
      - name: Wait for the app, Prometheus and Grafana
        run: |
          set -euo pipefail
          wait_for() {
            local name="$1" url="$2"
            for attempt in $(seq 1 90); do
              if curl -fsS "${url}" >/dev/null 2>&1; then
                echo "${name} ready after ${attempt} attempts"
                return 0
              fi
              sleep 2
            done
            echo "${name} did not become ready"
            docker compose ${COMPOSE_FILES} logs --no-color
            exit 1
          }
          wait_for "app" "http://localhost:8080/actuator/health"
          wait_for "prometheus" "http://localhost:9090/-/ready"
          wait_for "grafana" "http://localhost:3000/api/health"
      - name: Generate traffic and verify the scraped metrics
        run: |
          set -euo pipefail
          EVENT_ID=obs-1 ./scripts/send-event.sh
          EVENT_ID=obs-1 ./scripts/send-event.sh

          for attempt in $(seq 1 60); do
            accepted="$(curl -fsS -G --data-urlencode 'query=hookledger_ingest_total{result="accepted"}' \
              http://localhost:9090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')"
            duplicate="$(curl -fsS -G --data-urlencode 'query=hookledger_ingest_total{result="duplicate"}' \
              http://localhost:9090/api/v1/query | jq -r '.data.result[0].value[1] // "0"')"
            if [ "${accepted}" -ge 1 ] && [ "${duplicate}" -ge 1 ]; then
              echo "ingest counters scraped: accepted=${accepted} duplicate=${duplicate}"
              break
            fi
            sleep 2
          done
          [ "${accepted}" -ge 1 ] && [ "${duplicate}" -ge 1 ]

          for attempt in $(seq 1 60); do
            pending="$(curl -fsS -G --data-urlencode 'query=hookledger_outbox_pending' \
              http://localhost:9090/api/v1/query | jq -r '.data.result[0].value[1] // "999"')"
            if [ "${pending}" = "0" ]; then
              echo "outbox gauge scraped at 0"
              break
            fi
            sleep 2
          done
          [ "${pending}" = "0" ]

          names="$(curl -fsS -G --data-urlencode 'query={__name__=~"hookledger_.*"}' \
            http://localhost:9090/api/v1/query | jq -r '[.data.result[].metric.__name__] | unique[]')"
          echo "${names}"
          for expected in hookledger_ingest_total hookledger_delivery_total \
            hookledger_replay_total hookledger_outbox_pending \
            hookledger_outbox_oldest_age_seconds; do
            echo "${names}" | grep -qx "${expected}" || {
              echo "missing metric ${expected}"
              exit 1
            }
          done
      - name: Verify the alert rules are loaded
        run: |
          set -euo pipefail
          rules="$(curl -fsS http://localhost:9090/api/v1/rules)"
          echo "${rules}" | jq -r '.data.groups[].rules[].name'
          echo "${rules}" | jq -e '
            [.data.groups[].rules[].name]
            | (index("HookledgerTargetDown") != null)
              and (index("HookledgerOutboxBacklog") != null)
              and (index("HookledgerOutboxStalled") != null)
              and (index("HookledgerDeliveryFailureRate") != null)
              and (index("HookledgerIngest5xx") != null)
          ' >/dev/null
      - name: Verify Grafana serves the provisioned dashboard
        run: |
          set -euo pipefail
          dashboard=""
          for attempt in $(seq 1 60); do
            dashboard="$(curl -fsS -u admin:admin \
              http://localhost:3000/api/dashboards/uid/hookledger-overview || true)"
            if [ -n "${dashboard}" ] \
              && echo "${dashboard}" | jq -e '.dashboard.panels | length >= 10' >/dev/null 2>&1; then
              echo "dashboard ready after ${attempt} attempts"
              break
            fi
            sleep 2
          done
          echo "${dashboard}" | jq -e '.dashboard.title | test("hookledger")' >/dev/null
          echo "${dashboard}" | jq -e '.dashboard.panels | length >= 10' >/dev/null

          curl -fsS -u admin:admin \
            http://localhost:3000/api/datasources/uid/prometheus/health \
            | jq -e '.status == "OK"' >/dev/null
          echo "Grafana datasource and dashboard are healthy"
      - name: Dump logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILES} logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose ${COMPOSE_FILES} down -v

  k8s-manifests:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Render the manifests
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s > /tmp/hookledger.yaml
          grep -q 'name: hookledger-worker' /tmp/hookledger.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/hookledger.yaml
      - name: Validate with kubeconform
        run: |
          docker run --rm -v /tmp:/tmp ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.32.0 /tmp/hookledger.yaml

  postgres-down-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    env:
      COMPOSE_FILES: -f docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose ${COMPOSE_FILES} up -d --build
      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker compose ${COMPOSE_FILES} logs --no-color
          exit 1
      - name: Stop PostgreSQL
        run: docker compose ${COMPOSE_FILES} stop postgres
      - name: The API loses the database but stays alive
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 30); do
            health="$(curl -s --max-time 15 --connect-timeout 3 \
              -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)"
            if [ "${health}" = "503" ]; then
              echo "health is DOWN (503) after ${attempt} attempts"
              break
            fi
            sleep 2
          done
          echo "last health code while the database was down: ${health}"
          [ "${health}" = "503" ]

          liveness="$(curl -s --max-time 5 --connect-timeout 3 \
            -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness)"
          echo "liveness: ${liveness}"
          [ "${liveness}" = "200" ]

          timestamp="$(date +%s)"
          body='{"type":"chaos.test"}'
          signature="$(printf '%s.%s' "${timestamp}" "${body}" \
            | openssl dgst -sha256 -hmac 'dev-secret' -hex | sed 's/^.*= //')"
          ingest="$(curl -s -o /tmp/ingest.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Hook-Source: demo' \
            -H 'X-Hook-Id: postgres-down-1' \
            -H 'X-Hook-Timestamp: '"${timestamp}" \
            -H 'X-Hook-Signature: '"${signature}" \
            --data-binary "${body}" \
            http://localhost:8080/v1/events)"
          echo "ingest while the database is down: ${ingest}"
          cat /tmp/ingest.json
          echo
          [ "${ingest}" = "500" ]
      - name: Restart PostgreSQL and wait for recovery
        run: |
          set -euo pipefail
          docker compose ${COMPOSE_FILES} start postgres
          health=""
          for attempt in $(seq 1 60); do
            health="$(curl -s --max-time 15 --connect-timeout 3 \
              -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)"
            if [ "${health}" = "200" ]; then
              echo "health recovered after ${attempt} attempts"
              break
            fi
            sleep 2
          done
          echo "last health code during recovery: ${health}"
          [ "${health}" = "200" ]
      - name: Ingest after recovery
        run: |
          set -euo pipefail
          response="$(./scripts/send-event.sh postgres-recovery-1)"
          echo "ingest: ${response}"
          echo "${response}" | jq -e '.duplicate == false' >/dev/null
          event_id="$(echo "${response}" | jq -r .id)"
          event="$(curl -fsS "http://localhost:8080/v1/events/${event_id}")"
          echo "event: ${event}"
          echo "${event}" | jq -e '.status == "RECEIVED" or .status == "PUBLISHED"' >/dev/null
      - name: Dump logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILES} logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose ${COMPOSE_FILES} down -v

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

