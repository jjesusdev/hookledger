services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookledger
      POSTGRES_USER: hookledger
      POSTGRES_PASSWORD: hookledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookledger -d hookledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hookledger
      DB_USER: hookledger
      DB_PASSWORD: hookledger
      DEMO_WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-dev-secret}
      DEMO_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
