# In-cluster PostgreSQL for a demo. Production should use a managed database with backups,
# point-in-time recovery and a connection pooler; this StatefulSet is not that.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hookledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hookledger
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hookledger
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookledger
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: hookledger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hookledger
            - name: POSTGRES_USER
              value: hookledger
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hookledger-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hookledger", "-d", "hookledger"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hookledger", "-d", "hookledger"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
