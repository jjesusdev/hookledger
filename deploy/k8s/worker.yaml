apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookledger-worker
  labels:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: hookledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hookledger
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookledger
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: hookledger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: hookledger
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/jjesusdev/hookledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: hookledger-config
            - secretRef:
                name: hookledger-secrets
          env:
            - name: PORT
              value: "8081"
            - name: WORKER_ENABLED
              value: "true"
            - name: OUTBOX_ENABLED
              value: "false"
            - name: DEMO_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
