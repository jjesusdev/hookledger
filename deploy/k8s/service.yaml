apiVersion: v1
kind: Service
metadata:
  name: hookledger
  labels:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: hookledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hookledger
  labels:
    app.kubernetes.io/name: hookledger
    app.kubernetes.io/part-of: hookledger
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hookledger
      app.kubernetes.io/component: api
